global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: incident-simulator
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
