
global:
  resolve_timeout: 30s

route:
  receiver: incident-simulator-webhook
  group_by:
    - alertname
    - scenario
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h

receivers:
  - name: incident-simulator-webhook
    webhook_configs:
      - url: http://host.docker.internal:8000/webhooks/alertmanager
        send_resolved: true

